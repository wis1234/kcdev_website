<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie média - KEMT Center</title>
  <meta name="description" content="Galerie média du KEMT Center : images, vidéos et documentation visuelle.">
  <meta name="keywords" content="galerie, médias, images, vidéos, événements">
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/vendor/swiper/swiper-bundle.min.css" rel="stylesheet">
  <link href="assets/vendor/aos/aos.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
</head>
<body class="lang-fr">
<div data-include="includes/header.html"></div>
<main class="main">
  <section class="section hero pt-5 pb-5 bg-light text-dark">
    <div class="container">
      <h1><span data-lang="fr">Galerie média</span><span data-lang="en" class="d-none">Media gallery</span></h1>
      <p class="lead"><span data-lang="fr">Images, vidéos et fichiers médias des événements et projets.</span><span data-lang="en" class="d-none">Images, videos, and media files from events and projects.</span></p>
    </div>
  </section>
  <section class="section py-5">
    <div class="container">
      <div class="row gy-4">
        <div class="col-12" data-aos="fade-up">
          <div class="swiper gallery-slider">
            <div class="swiper-wrapper">
              <div class="swiper-slide"><img src="assets/img/hero-carousel/hero-carousel-1.jpg_old" alt="" class="img-fluid rounded-4"></div>
              <div class="swiper-slide"><img src="assets/img/hero-carousel/hero-carousel-2.jpg_old" alt="" class="img-fluid rounded-4"></div>
              <div class="swiper-slide"><img src="assets/img/hero-carousel/hero-carousel-3.jpeg__" alt="" class="img-fluid rounded-4"></div>
            </div>
            <div class="swiper-pagination"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
  <div data-include="includes/footer.html"></div>
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/swiper/swiper-bundle.min.js"></script>
  <script src="assets/vendor/aos/aos.js"></script>
  <script src="assets/js/include-html.js"></script>
  <script src="assets/js/lang-switcher.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function(){ if(window.AOS) AOS.init({once:true}); if(window.Swiper) new Swiper('.gallery-slider',{loop:true,autoplay:{delay:3500},pagination:{el:'.swiper-pagination',clickable:true}}); });
  </script>
</body>
</html>
